[project]
name = "adawork"
dynamic = ["version"]
description = "Hledání volných pracovních míst v Česku ze všech zdrojů na jednom místě."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "pydantic>=2.8",
    "platformdirs>=4.2",
    "pywebview>=5.2",
    "pystray>=0.19",
    "pillow>=10.4",
    "httpx>=0.27",
    "sqlalchemy>=2.1.3",
    "alembic>=1.20.0",
    "ijson>=3.5.1",
    "python-multipart>=0.0.32",
    "pyproj>=3.8.0",
    "selectolax>=1.0.0",
    "psutil>=7.2.2",
    "onnxruntime>=1.30.0",
    "tokenizers>=0.23.2",
    "numpy>=2.5.3",
    "pyyaml>=6.0.3",
    "playwright>=1.63.0",
    "rapidfuzz>=3.9",
    "ddgs>=9.16",
    "packaging>=24",  # adawork.licenses: which packages the app bundles
]

[project.gui-scripts]
adawork = "adawork.cli:main"

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "import-linter>=2.15",
    "openpyxl>=3.1.5",
    "pyinstaller>=6.22.3",
    "pyright>=1.1.414",
    "pytest>=8.3",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "adawork/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["adawork"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["*.md", "spikes"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyright]
include = ["adawork"]
pythonVersion = "3.12"

# A package imports only from the layers below it (ARCHITECTURE.md). `uv run lint-imports`
[tool.importlinter]
root_package = "adawork"

[[tool.importlinter.contracts]]
name = "Layers"
type = "layers"
containers = ["adawork"]
layers = [
    "cli",
    "web",
    "services",
    "desktop | scheduler | employers",
    "scraper",
    "social | ai",
    "search",
    "routing",
    "geo",
    "db",
    "normalize",
    "config | core | i18n | net | system | secrets | logs | licenses | worker",
    "paths",
]
