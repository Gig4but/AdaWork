# MOTIS v2.11.3 spike config: whole Czech Republic, national Spojenka GTFS, all features on.
# Paths are relative to the working directory spikes/routing/data/full
server:
  port: 8080
  web_folder: ../motis/ui
osm: ../dl/czech-republic-latest.osm.pbf
tiles:
  profile: ../motis/tiles-profiles/full.lua
  db_size: 274877906944
  flush_threshold: 100000
timetable:
  first_day: 2026-10-06
  num_days: 30
  railviz: true
  with_shapes: true
  datasets:
    spoj:
      path: ../dl/spojenka_noblock.zip
street_routing: true
osr_footpath: true
geocoding: true
reverse_geocoding: true
limits:
  onetomany_max_many: 10000
  onetoall_max_travel_minutes: 120
