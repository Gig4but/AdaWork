# MOTIS v2.11.3 spike config: 150 km circle around Brno (osmium extract -s complete_ways + clip_gtfs.py), all features on.
# Import peak working set 4.7 GB (osr). See config_clip150_8gb.yml for the low-RAM variant.
# Paths are relative to the working directory spikes/routing/data/clip150
server:
  port: 8080
  web_folder: ../motis/ui
osm: brno150_cw.osm.pbf
tiles:
  profile: ../motis/tiles-profiles/full.lua
  db_size: 274877906944
  flush_threshold: 100000
timetable:
  first_day: 2026-10-06
  num_days: 30
  railviz: true
  with_shapes: true
  datasets:
    spoj:
      path: spojenka_brno150.zip
street_routing: true
osr_footpath: true
geocoding: true
reverse_geocoding: true
limits:
  onetomany_max_many: 10000
  onetoall_max_travel_minutes: 120
