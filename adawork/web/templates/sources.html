{% extends "base.html" %}
{% block title %}{{ t("sources.title") }} – AdaWork{% endblock %}
{% block content %}
<article class="wizard">
  <h2>{{ t("sources.title") }}</h2>
  <p>{{ t("sources.text") }}</p>
  {% if saved %}<p class="ok" role="status">{{ t("sources.saved") }}</p>{% endif %}
  <form method="post" action="/sources">
    {% include "_sources_form.html" %}
    <button type="submit">{{ t("sources.save") }}</button>
  </form>
</article>
{% endblock %}
