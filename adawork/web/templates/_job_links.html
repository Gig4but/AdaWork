{# A job's sources, each with a link to its original ad (job cards and the whole text). #}
{% for src in job.sources if src.status == "active" or job.status != "active" %}
  <span class="badge">{{ src.source_id | source_label }}</span>
  {% if src.url %}<a href="{{ src.url | safe_url }}" target="_blank" rel="noopener">{{ t("job.open") }} ↗</a>{% endif %}
{% endfor %}
