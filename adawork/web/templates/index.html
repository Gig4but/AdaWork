<!doctype html>
<html lang="{{ settings.language }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AdaWork</title>
  <style>
    :root { color-scheme: light dark; font-family: "Segoe UI", system-ui, sans-serif; }
    body { margin: 0; display: grid; place-items: center; min-height: 100vh; }
    main { max-width: 32rem; padding: 2rem; text-align: center; }
    h1 { margin-bottom: .25rem; }
    .muted { opacity: .7; }
    button { font: inherit; padding: .6rem 1.2rem; border-radius: .5rem; cursor: pointer; }
  </style>
</head>
<body>
  <main>
    <h1>AdaWork</h1>
    <p class="muted">verze {{ version }}</p>
    <p>Aplikace běží. Brzy zde najdete volná pracovní místa z celé České republiky.</p>
    {% if settings.automation.enabled %}
      <p>Automatické hledání: každých {{ settings.automation.interval_hours }} h</p>
    {% else %}
      <p>Automatické hledání je vypnuté.</p>
      <button disabled title="Bude dostupné v další verzi">Hledat nové nabídky</button>
    {% endif %}
  </main>
</body>
</html>
